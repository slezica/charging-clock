apply plugin: 'com.android.application'

// Release signing: keystore at secrets/release.keystore (untracked), password
// via the KEYSTORE_PASSWORD env var, provided interactively by bin/chclock
// prepare. Never stored on disk. See docs/PUBLISHING.md.
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')

android {
    namespace "io.salezica.chclock"
    compileSdkVersion 35
    defaultConfig {
        applicationId "io.salezica.chclock"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 10000
        versionName "1.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (keystorePassword != null) {
                storeFile rootProject.file('secrets/release.keystore')
                storePassword keystorePassword
                keyAlias 'chclock'
                keyPassword keystorePassword
            }
        }
    }
    buildTypes {
        debug {
            // Never collides with the store install on a personal device:
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePassword != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'androidx.core:core:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
